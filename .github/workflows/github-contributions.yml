name: Update GitHub contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution data
        run: |
          mkdir -p data
          curl -fsSL --retry 3 --retry-delay 10 \
            "https://github-contributions-api.jogruber.de/v4/EthanShenx?y=last" \
            -o /tmp/contributions.json
          # Only replace the snapshot when the response has contribution data
          jq -e '.contributions | length > 0' /tmp/contributions.json > /dev/null
          jq -c '{total: .total, contributions: .contributions}' \
            /tmp/contributions.json > data/github-contributions.json

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub contributions snapshot"
          git push
